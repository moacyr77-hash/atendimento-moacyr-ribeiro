<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Moacyr Ribeiro Advocacia — Atendimento Confidencial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F2EC;
      --paper: #FFFFFF;
      --paper-soft: #FAF8F4;
      --deep: #0C161A;
      --deep-2: #122126;
      --emerald: #1B3B30;
      --emerald-dark: #132B23;
      --emerald-soft: #EDF3F0;
      --gold: #C2A470;
      --gold-soft: rgba(194, 164, 112, 0.16);
      --gold-line: rgba(194, 164, 112, 0.42);
      --ink: #121715;
      --muted: #464E4A;
      --subtle: #6E7772;
      --line: rgba(12, 22, 26, 0.09);
      --line-strong: rgba(12, 22, 26, 0.16);
      --danger: #9B2C2C;
      --radius: 20px;
      --shadow-card:
        0 1px 2px rgba(12, 22, 26, 0.04),
        0 12px 32px rgba(12, 22, 26, 0.07),
        0 28px 60px rgba(12, 22, 26, 0.04);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(1200px 420px at 50% 0%, rgba(194, 164, 112, 0.09), transparent 70%),
        var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Banner discreto de Prévia do Advogado */
    .preview-banner {
      background: #070D10;
      color: #D8E2DF;
      padding: 10px 18px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(194, 164, 112, 0.24);
    }
    .preview-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(194, 164, 112, 0.18);
      color: #E8D5B0;
      border: 1px solid rgba(194, 164, 112, 0.35);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .preview-switch {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #FAF8F4;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .preview-switch:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--gold);
    }

    /* Cabeçalho institucional só com a logo */
    .hero-header {
      background: linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%);
      padding: 20px 20px 18px;
      border-bottom: 1px solid var(--gold-line);
    }
    .hero-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-logo {
      height: 44px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .step-pill {
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #E9DFCC;
      background: rgba(194, 164, 112, 0.12);
      border: 1px solid rgba(194, 164, 112, 0.32);
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Barra de progresso fina dourada */
    .progress-track {
      height: 3px;
      background: rgba(12, 22, 26, 0.12);
      width: 100%;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald) 0%, var(--gold) 100%);
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Container principal */
    main {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeUp 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (min-width: 560px) {
      .card { padding: 38px 36px; gap: 22px; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Eyebrow elegante */
    .eyebrow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--emerald);
    }
    .eyebrow::before {
      content: "";
      width: 18px;
      height: 1.5px;
      background: var(--gold);
      display: inline-block;
    }
    .status-chip {
      font-size: 12px;
      font-weight: 600;
      color: #8A5A12;
      background: #FDF6E7;
      border: 1px solid rgba(194, 164, 112, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Títulos */
    h1.editorial-title {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 33px;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    h1.question-title {
      margin: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22.5px;
      line-height: 1.32;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .helper {
      margin: -6px 0 0;
      font-size: 15.5px;
      line-height: 1.55;
      color: var(--muted);
    }

    /* Lista da tela inicial */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
      background: var(--paper-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .step-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      color: var(--ink);
    }
    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--emerald-soft);
      color: var(--emerald);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Nota jurídica exclusiva do modo prévia */
    .lawyer-note {
      background: #F6F8F7;
      border: 1px solid rgba(27, 59, 48, 0.14);
      border-left: 3px solid var(--gold);
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }
    .lawyer-note b { color: var(--emerald); }

    /* Opções grandes, limpas e táteis */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 17px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--line-strong);
      background: var(--paper-soft);
      color: var(--ink);
      font-family: inherit;
      font-size: 16.5px;
      line-height: 1.38;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 62px;
      transition: all 160ms ease;
    }
    .opt-btn:hover {
      border-color: var(--emerald);
      background: var(--emerald-soft);
    }
    .opt-btn:active { transform: scale(0.992); }
    .opt-btn.selected {
      background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-dark) 100%);
      color: #FAF8F4;
      border-color: var(--emerald);
      box-shadow: 0 6px 18px rgba(27, 59, 48, 0.22);
    }
    .opt-check {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid rgba(12, 22, 26, 0.24);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      transition: all 160ms ease;
    }
    .opt-btn.selected .opt-check {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--deep);
    }

    /* Campo de detalhes + microfone elegante */
    .note-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
    }
    .note-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--line-strong);
      background: var(--paper-soft);
      color: var(--ink);
      resize: vertical;
      outline: none;
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }
    textarea:focus {
      border-color: var(--emerald);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(27, 59, 48, 0.1);
    }

    .mic-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .mic-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px;
      border-radius: 11px;
      border: 1.5px solid rgba(27, 59, 48, 0.28);
      background: var(--emerald-soft);
      color: var(--emerald);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      min-height: 46px;
      transition: all 150ms ease;
    }
    .mic-btn:hover:not(:disabled) {
      border-color: var(--emerald);
      background: #E1ECE6;
    }
    .mic-btn.recording {
      background: var(--danger);
      border-color: var(--danger);
      color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(155, 44, 44, 0.18);
    }
    .mic-status {
      font-size: 13px;
      color: var(--subtle);
    }

    .skip-btn {
      background: transparent;
      border: none;
      color: var(--subtle);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      padding: 6px 2px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      align-self: flex-start;
    }
    .skip-btn.selected {
      color: var(--emerald);
      font-weight: 700;
    }

    /* Barra de navegação inferior */
    .nav-bar {
      margin-top: 6px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      min-height: 54px;
      border-radius: 13px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      transition: all 150ms ease;
    }
    .btn:hover:not(:disabled) { border-color: var(--emerald); background: var(--paper-soft); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-dark) 100%);
      border-color: var(--emerald);
      color: #FAF8F4;
      flex: 1.7;
      box-shadow: 0 6px 18px rgba(27, 59, 48, 0.22);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--emerald-dark);
      box-shadow: 0 8px 22px rgba(27, 59, 48, 0.28);
    }
    .btn-full { width: 100%; flex: none; }

    /* Resumo final */
    .summary-list {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper-soft);
      padding: 4px 16px;
    }
    .summary-item {
      border-top: 1px solid var(--line);
      padding: 13px 0;
    }
    .summary-item:first-child { border-top: none; }
    .summary-q { font-size: 13px; color: var(--subtle); font-weight: 600; }
    .summary-a { font-size: 15.5px; color: var(--ink); margin-top: 4px; font-weight: 600; }
    .summary-note { font-size: 14px; color: var(--muted); margin-top: 4px; font-style: italic; }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Rodapé discreto e elegante */
    footer {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      padding: 8px 20px 30px;
      font-size: 12.5px;
      color: var(--subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .trust-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--deep);
      color: #FAF8F4;
      border: 1px solid rgba(194, 164, 112, 0.35);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 12px 30px rgba(12, 22, 26, 0.3);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

      try {
        const salvo = JSON.parse(localStorage.getItem(STORAGE_KEY()) || 'null');

      } catch (_) {}
      return { tela: 'inicio', indice: 0, respostas: {}, concluidoEm: null };
    }

      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

      if (estado.tela === 'inicio') {

        fill.style.width = '0%';
      } else if (estado.tela === 'fim') {
        pill.textContent = 'Concluído';
        fill.style.width = '100%';
      } else {
        const num = String(estado.indice + 1).padStart(2, '0');
        const tot = String(PERGUNTAS.length).padStart(2, '0');
        const pct = Math.round(((estado.indice + 1) / PERGUNTAS.length) * 100);

        fill.style.width = `${pct}%`;

      const p = PERGUNTAS[estado.indice];
      const atual = estado.respostas[p.id] || { opcao: '', nota: '', naoSei: false };
      const ehUltima = estado.indice === PERGUNTAS.length - 1;

      app.innerHTML = `

          btnMic.innerHTML = `${ICONS.stop} <span>Parar gravação</span>`;

          recognition.onresult = (event) => {
            let textoNovo = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              if (event.results[i].isFinal) {
                textoNovo += event.results[i][0].transcript + ' ';
              }
            }
            if (textoNovo.trim()) {

          recognition.onerror = (e) => {
            gravando = false;
            btnMic.classList.remove('recording');
            btnMic.innerHTML = `${ICONS.mic} <span>Falar pelo microfone</span>`;
            micStatus.textContent = e.error === 'not-allowed'
              ? 'Permita o acesso ao microfone no navegador para ditar.'
              : 'Não foi possível captar o áudio. Tente novamente.';
          };
          recognition.onend = () => {
            gravando = false;
            btnMic.classList.remove('recording');
            btnMic.innerHTML = `${ICONS.mic} <span>Falar pelo microfone</span>`;
          };
          recognition.start();
        };
      }

        }
        salvarEstado();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

    function gerarResumoTexto() {
      const linhas = [
        `*Moacyr Ribeiro Advocacia — Respostas do Atendimento (${modoPrevia ? 'PRÉVIA ADVOGADO' : 'ELIEGE'})*`,
        `Data: ${new Date().toLocaleString('pt-BR')}`,
        ''
      ];
      PERGUNTAS.forEach((p, idx) => {
        const r = estado.respostas[p.id] || {};
        const resp = r.naoSei ? 'Não sei responder agora (pendente)' : (r.opcao || 'Sem opção selecionada');
        linhas.push(`*${String(idx + 1).padStart(2, '0')}. ${p.titulo}*`);
        linhas.push(`Resposta: ${resp}`);
        if (r.nota && r.nota.trim()) {
          linhas.push(`Obs.: ${r.nota.trim()}`);
        }
        linhas.push('');
      });
      return linhas.join('\n');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    render();
  </script>
</body>
</html>
