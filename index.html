<html lang="pt-BR">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF9F6;
      --paper: #FFFFFF;
      --deep: #0E191E;
      --night: #05090A;
      --emerald: #1F4034;
      --emerald-hover: #163026;
      --mist: #DFEAE8;
      --mist-mid: #B8C9C7;
      --mist-text: #9BA8A5;
      --ink: #1F2421;
      --muted: #4A524E;
      --line: rgba(31, 64, 52, 0.13);
      --line-strong: rgba(31, 64, 52, 0.24);
      --danger: #8A2B22;
      --radius: 14px;
      --shadow: 0 2px 6px rgba(5, 9, 10, 0.04), 0 12px 32px rgba(14, 25, 30, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Banner de Prévia do Advogado */
    .preview-banner {
      background: var(--deep);
      color: #DFEAE8;
      padding: 11px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(223, 234, 232, 0.14);
    }
    .preview-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(223, 234, 232, 0.14);
      color: #FAF9F6;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .preview-switch {
      background: transparent;
      border: 1px solid rgba(223, 234, 232, 0.35);
      color: #FAF9F6;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    /* Cabeçalho institucional Moacyr Ribeiro */
    .hero-header {
      background: var(--deep);
      color: #FAF9F6;
      padding: 18px 20px 20px;
    }
    .hero-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
    }
    .brand-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .step-pill {
      font-size: 13px;
      font-weight: 600;
      color: #FAF9F6;
      background: rgba(223, 234, 232, 0.14);
      border: 1px solid rgba(223, 234, 232, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Barra de progresso */
    .progress-wrap {
      background: var(--deep);
      padding: 0 20px 14px;
    }
    .progress-track {
      max-width: 640px;
      margin: 0 auto;
      height: 4px;
      background: rgba(223, 234, 232, 0.18);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #DFEAE8;
      border-radius: 999px;
      transition: width 260ms ease;
    }

    /* Conteúdo principal */
    main {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 36px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .section-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--emerald);
      background: var(--mist);
      padding: 4px 11px;
      border-radius: 999px;
      letter-spacing: 0.01em;
    }

    h1 {
      margin: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 23px;
      line-height: 1.32;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #111614;
    }
    .helper {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: #3B433F;
    }

    /* Caixa exclusiva da Prévia do Advogado */
    .lawyer-note {
      background: #F4F7F6;
      border-left: 3px solid var(--emerald);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .lawyer-note b { color: var(--emerald); }

    /* Botões grandes de opção */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: 12px;
      border: 1.5px solid var(--line-strong);
      background: var(--paper);
      color: #111614;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.38;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: all 140ms ease;
      min-height: 62px;
    }
    .opt-btn:active { transform: scale(0.99); }
    .opt-btn.selected {
      background: var(--emerald);
      color: #FAF9F6;
      border-color: var(--emerald);
    }
    .opt-check {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1.5px solid var(--line-strong);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
    }
    .opt-btn.selected .opt-check {
      background: #FAF9F6;
      color: var(--emerald);
      border-color: #FAF9F6;
      font-weight: 700;
    }

    /* Observação opcional + microfone */
    .note-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .note-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--line-strong);
      background: var(--bg);
      color: var(--ink);
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: var(--emerald);
      background: #fff;
    }

    .mic-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .mic-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--emerald);
      background: var(--mist);
      color: var(--emerald);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
    }
    .mic-btn.recording {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.78; }
    }
    .mic-status {
      font-size: 13px;
      color: var(--muted);
    }

    .skip-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 4px;
      cursor: pointer;
      text-decoration: underline;
      align-self: flex-start;
    }
    .skip-btn.selected {
      color: var(--emerald);
      font-weight: 700;
    }

    /* Navegação */
    .nav-bar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      min-height: 54px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      transition: all 140ms ease;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #FAF9F6;
      flex: 1.6;
    }
    .btn-primary:hover:not(:disabled) { background: var(--emerald-hover); }
    .btn-whatsapp {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #FAF9F6;
      width: 100%;
    }

    .welcome-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .summary-item {
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }
    .summary-q { font-size: 13px; color: var(--muted); font-weight: 600; }
    .summary-a { font-size: 15px; color: var(--ink); margin-top: 3px; font-weight: 500; }
    .summary-note { font-size: 14px; color: var(--muted); margin-top: 4px; font-style: italic; }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    footer {
      text-align: center;
      padding: 18px 16px 28px;
      font-size: 12px;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--deep);
      color: #FAF9F6;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(5, 9, 10, 0.25);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

        contrato: 'Distratos e Desmobilização',
        baseLegal: 'Encerramento de obrigações continuadas (ex.: EVS / Helping Hand)',
        titulo: 'Além do contrato da EVS / Helping Hand, existe algum outro contrato ativo (sistema, internet, alarme, fornecedor) para encerrar ou transferir?',
        ajuda: 'Queremos evitar que continue chegando cobrança depois que você sair da operação.',
        opcoes: [
          'Não, apenas aquele que já enviei',
          'Sim, existem outros contratos ativos',
          'Vou conferir e aviso vocês'
        ],
        placeholder: 'Se lembrar de outros contratos ativos, liste ou fale aqui...'
      },
      {
        id: 'observacoes_finais',
        bloco: '16 · Suas Palavras',
        contrato: 'Checklist Final de Conferência Jurídica',
        baseLegal: 'Revisão integral antes das minutas definitivas',
        titulo: 'Faltou algum combinado importante ou algo que esteja te preocupando mais antes do dia 1º?',
        ajuda: 'Fique totalmente à vontade para apertar o botão do microfone e falar com suas próprias palavras.',
        opcoes: [
          'Está tudo coberto nas perguntas anteriores',
          'Sim, deixei um recado importante abaixo'
        ],
        placeholder: 'Aperte "Falar pelo microfone" ou escreva aqui o que quiser nos dizer...'
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const modoPrevia = params.get('modo') === 'previa';
    const STORAGE_KEY = () => modoPrevia ? 'mr_adv_eliege_previa_v1' : 'mr_adv_eliege_cliente_v1';

    let estado = carregarEstado();
    let recognition = null;
    let gravando = false;

    function carregarEstado() {
      try {
        const salvo = JSON.parse(localStorage.getItem(STORAGE_KEY()) || 'null');
        if (salvo && typeof salvo === 'object') return salvo;
      } catch (_) {}
      return { tela: 'inicio', indice: 0, respostas: {}, concluidoEm: null };
    }

    function salvarEstado() {
      try {
        localStorage.setItem(STORAGE_KEY(), JSON.stringify(estado));
      } catch (_) {}
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function atualizarTopo() {
      const banner = document.getElementById('previewBanner');
      const pill = document.getElementById('stepPill');
      const fill = document.getElementById('progressFill');

      banner.style.display = modoPrevia ? 'flex' : 'none';

      if (estado.tela === 'inicio') {
        pill.textContent = '16 perguntas rápidas';
        fill.style.width = '0%';
      } else if (estado.tela === 'fim') {
        pill.textContent = 'Concluído · 100%';
        fill.style.width = '100%';
      } else {
        const num = estado.indice + 1;
        const pct = Math.round((num / PERGUNTAS.length) * 100);
        pill.textContent = `${num} de ${PERGUNTAS.length}`;
        fill.style.width = `${pct}%`;
      }
    }

    document.getElementById('btnToggleMode').addEventListener('click', () => {
      const url = new URL(window.location.href);
      url.searchParams.set('modo', modoPrevia ? 'cliente' : 'previa');
      window.location.href = url.toString();
    });

    function pararMicrofone() {
      if (recognition && gravando) {
        try { recognition.stop(); } catch (_) {}
      }
      gravando = false;
    }

    function render() {
      pararMicrofone();
      atualizarTopo();
      const app = document.getElementById('app');

      if (estado.tela === 'inicio') {
        app.innerHTML = `
          <section class="card">
            <div class="tag-row">
              <span class="section-tag">Reestruturação · Proteção Patrimonial</span>
              ${modoPrevia ? '<span class="section-tag" style="background:#FEF3C7;color:#92400E;">Prévia do Advogado</span>' : ''}
            </div>
            <h1>Olá, Eliege. Vamos organizar cada detalhe com calma e segurança.</h1>
            <p class="helper">
              Preparamos 16 perguntas diretas para a nossa equipe redigir os <strong>3 contratos com segurança jurídica</strong> antes do dia 1º de dezembro.
            </p>
            <ul class="welcome-list">
              <li>Aparece <strong>uma pergunta por vez</strong>, com botões grandes para tocar.</li>
              <li>Você pode <strong>falar pelo microfone</strong> em vez de digitar.</li>
              <li>Se não souber alguma resposta agora, toque em <em>“Não sei responder agora”</em> e siga normalmente.</li>
              <li>Ao concluir, basta um toque para enviar tudo direto ao WhatsApp do Dr. Moacyr.</li>
            </ul>
            ${modoPrevia ? `
              <div class="lawyer-note">
                <b>Conferência do Escritório:</b> neste modo você vê o mapeamento jurídico de cada pergunta (Contratos 01, 02, 03 e travas pré-posse) e testa todo o fluxo sem alterar o ambiente definitivo da cliente.
              </div>
            ` : ''}
            <div class="nav-bar">
              <button class="btn btn-primary" id="btnComecar" type="button">Começar atendimento →</button>
            </div>
          </section>
        `;
        document.getElementById('btnComecar').onclick = () => {
          estado.tela = 'pergunta';
          salvarEstado();
          render();
        };
        return;
      }

      if (estado.tela === 'fim') {
        const resumoTexto = gerarResumoTexto();
        const pendentes = PERGUNTAS.filter(p => {
          const r = estado.respostas[p.id];
          return !r || r.naoSei || (!r.opcao && !(r.nota || '').trim());
        }).length;

        app.innerHTML = `
          <section class="card">
            <div class="tag-row">
              <span class="section-tag">Atendimento concluído</span>
              ${pendentes > 0 ? `<span class="section-tag" style="background:#FEF3C7;color:#92400E;">${pendentes} ponto(s) para alinhar com os advogados</span>` : ''}
            </div>
            <h1>${modoPrevia ? 'Simulação concluída com sucesso' : 'Obrigada, Eliege. Suas respostas estão prontas.'}</h1>
            <p class="helper">
              ${modoPrevia
                ? 'Abaixo está exatamente o resumo estruturado que será enviado ao WhatsApp oficial do escritório ((62) 99274-6464) e opcionalmente por e-mail.'
                : 'Toque no botão abaixo para enviar suas respostas diretamente ao WhatsApp do escritório do Dr. Moacyr Ribeiro.'}
            </p>

            <div class="actions-stack">
              <button class="btn btn-whatsapp" id="btnWhatsApp" type="button">Enviar para o WhatsApp do Dr. Moacyr →</button>
              <button class="btn" id="btnEmail" type="button">Enviar por e-mail (escritorio@moacyrribeiro.adv.br)</button>
              <button class="btn" id="btnCopiar" type="button">Copiar resumo completo</button>
              <button class="btn" id="btnBaixarJson" type="button">Baixar arquivo estruturado (.json)</button>
            </div>

            <div style="margin-top:8px;">
              ${PERGUNTAS.map((p, idx) => {
                const r = estado.respostas[p.id] || {};
                const resp = r.naoSei ? 'Não sei responder agora (pendente)' : (r.opcao || 'Sem opção selecionada');
                return `
                  <div class="summary-item">
                    <div class="summary-q">${idx + 1}. ${p.titulo}</div>
                    <div class="summary-a">${escapeHtml(resp)}</div>
                    ${r.nota ? `<div class="summary-note">Obs.: ${escapeHtml(r.nota)}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="nav-bar">
              <button class="btn" id="btnRevisar" type="button">← Revisar respostas</button>
              <button class="btn" id="btnReiniciar" type="button">Limpar teste</button>
            </div>
          </section>
        `;

        document.getElementById('btnWhatsApp').onclick = () => {
          const url = `https://wa.me/${WHATSAPP_ESCRITORIO}?text=` + encodeURIComponent(resumoTexto);
          window.open(url, '_blank', 'noopener');
        };
        document.getElementById('btnEmail').onclick = () => {
          const assunto = encodeURIComponent(`Respostas do Atendimento — Eliege (${modoPrevia ? 'Prévia' : 'Definitivo'})`);
          const corpo = encodeURIComponent(resumoTexto);
          window.location.href = `mailto:${EMAIL_ESCRITORIO}?subject=${assunto}&body=${corpo}`;
        };
        document.getElementById('btnCopiar').onclick = async () => {
          try {
            await navigator.clipboard.writeText(resumoTexto);
            toast('Resumo copiado!');
          } catch (_) {
            toast('Não foi possível copiar automaticamente.');
          }
        };
        document.getElementById('btnBaixarJson').onclick = () => {
          const payload = {
            escritorio: 'Moacyr Ribeiro Advocacia',
            modo: modoPrevia ? 'previa_advogado' : 'cliente_eliege',
            gerado_em: new Date().toISOString(),
            total_perguntas: PERGUNTAS.length,
            respostas: PERGUNTAS.map((p, idx) => ({
              numero: idx + 1,
              id: p.id,
              contrato: p.contrato,
              pergunta: p.titulo,
              ...(estado.respostas[p.id] || {})
            }))
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `respostas-eliege-${modoPrevia ? 'previa' : 'final'}.json`;
          a.click();
          toast('Arquivo baixado!');
        };
        document.getElementById('btnRevisar').onclick = () => {
          estado.tela = 'pergunta';
          estado.indice = PERGUNTAS.length - 1;
          salvarEstado();
          render();
        };
        document.getElementById('btnReiniciar').onclick = () => {
          estado = { tela: 'inicio', indice: 0, respostas: {}, concluidoEm: null };
          salvarEstado();
          render();
          toast('Respostas limpas.');
        };
        return;
      }

      const p = PERGUNTAS[estado.indice];
      const atual = estado.respostas[p.id] || { opcao: '', nota: '', naoSei: false };
      const ehUltima = estado.indice === PERGUNTAS.length - 1;

      app.innerHTML = `
        <section class="card">
          <div class="tag-row">
            <span class="section-tag">${escapeHtml(p.bloco)}</span>
          </div>
          <h1>${escapeHtml(p.titulo)}</h1>
          <p class="helper">${escapeHtml(p.ajuda)}</p>

          ${modoPrevia ? `
            <div class="lawyer-note">
              <b>Mapeamento Jurídico (somente prévia):</b><br/>
              • Destino: ${escapeHtml(p.contrato)}<br/>
              • Base: ${escapeHtml(p.baseLegal)}
            </div>
          ` : ''}

          <div class="options" id="optionsWrap">
            ${p.opcoes.map((op, i) => `
              <button
                type="button"
                class="opt-btn ${!atual.naoSei && atual.opcao === op ? 'selected' : ''}"
                data-idx="${i}"
              >
                <span>${escapeHtml(op)}</span>
                <span class="opt-check">${!atual.naoSei && atual.opcao === op ? '✓' : ''}</span>
              </button>
            `).join('')}
          </div>

          <div class="note-box">
            <label class="note-label" for="notaInput">Quer explicar algum detalhe? (opcional)</label>
            <textarea id="notaInput" rows="3" placeholder="${escapeHtml(p.placeholder)}">${escapeHtml(atual.nota || '')}</textarea>
            <div class="mic-row">
              <button type="button" class="mic-btn" id="btnMic">🎙️ Falar pelo microfone</button>
              <span class="mic-status" id="micStatus">Toque para ditar em português</span>
            </div>
          </div>

          <button type="button" class="skip-btn ${atual.naoSei ? 'selected' : ''}" id="btnNaoSei">
            ${atual.naoSei ? '✓ Marcado: Não sei responder agora' : 'Não sei responder agora'}
          </button>

          <div class="nav-bar">
            <button class="btn" id="btnVoltar" type="button">← Voltar</button>
            <button class="btn btn-primary" id="btnAvancar" type="button">
              ${ehUltima ? 'Finalizar e revisar ✓' : 'Próxima →'}
            </button>
          </div>
        </section>
      `;

      const guardar = (patch) => {
        estado.respostas[p.id] = { ...(estado.respostas[p.id] || { opcao: '', nota: '', naoSei: false }), ...patch };
        salvarEstado();
      };

      document.querySelectorAll('#optionsWrap .opt-btn').forEach(btn => {
        btn.onclick = () => {
          const op = p.opcoes[Number(btn.dataset.idx)];
          guardar({ opcao: op, naoSei: false });
          render();
        };
      });

      const notaEl = document.getElementById('notaInput');
      notaEl.addEventListener('input', () => {
        guardar({ nota: notaEl.value });
      });

      document.getElementById('btnNaoSei').onclick = () => {
        const novo = !atual.naoSei;
        guardar({ naoSei: novo, ...(novo ? { opcao: '' } : {}) });
        render();
      };

      const btnMic = document.getElementById('btnMic');
      const micStatus = document.getElementById('micStatus');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        micStatus.textContent = 'Ditado direto indisponível neste navegador (use o microfone do teclado do celular).';
        btnMic.disabled = true;
      } else {
        btnMic.onclick = () => {
          if (gravando) {
            pararMicrofone();
            btnMic.classList.remove('recording');
            btnMic.textContent = '🎙️ Falar pelo microfone';
            micStatus.textContent = 'Gravação pausada.';
            return;
          }
          recognition = new SpeechRecognition();
          recognition.lang = 'pt-BR';
          recognition.continuous = true;
          recognition.interimResults = false;
          gravando = true;
          btnMic.classList.add('recording');
          btnMic.textContent = '⏹️ Parar gravação';
          micStatus.textContent = 'Ouvindo... pode falar com calma.';

          recognition.onresult = (event) => {
            let textoNovo = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              if (event.results[i].isFinal) {
                textoNovo += event.results[i][0].transcript + ' ';
              }
            }
            if (textoNovo.trim()) {
              const atualTexto = notaEl.value.trim();
              notaEl.value = atualTexto ? `${atualTexto} ${textoNovo.trim()}` : textoNovo.trim();
              guardar({ nota: notaEl.value });
            }
          };
          recognition.onerror = (e) => {
            gravando = false;
            btnMic.classList.remove('recording');
            btnMic.textContent = '🎙️ Falar pelo microfone';
            micStatus.textContent = e.error === 'not-allowed'
              ? 'Permita o acesso ao microfone no navegador para ditar.'
              : 'Não foi possível captar o áudio. Tente novamente.';
          };
          recognition.onend = () => {
            gravando = false;
            btnMic.classList.remove('recording');
            btnMic.textContent = '🎙️ Falar pelo microfone';
          };
          recognition.start();
        };
      }

      document.getElementById('btnVoltar').onclick = () => {
        if (estado.indice === 0) {
          estado.tela = 'inicio';
        } else {
          estado.indice -= 1;
        }
        salvarEstado();
        render();
      };

      document.getElementById('btnAvancar').onclick = () => {
        const r = estado.respostas[p.id] || {};
        if (!r.opcao && !r.naoSei && !(r.nota || '').trim()) {
          toast('Escolha uma opção, escreva um detalhe ou toque em "Não sei responder agora".');
          return;
        }
        if (ehUltima) {
          estado.tela = 'fim';
          estado.concluidoEm = new Date().toISOString();
        } else {
          estado.indice += 1;
        }
        salvarEstado();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }

    function gerarResumoTexto() {
      const linhas = [
        `*Moacyr Ribeiro Advocacia — Respostas do Atendimento (${modoPrevia ? 'PRÉVIA ADVOGADO' : 'ELIEGE'})*`,
        `Data: ${new Date().toLocaleString('pt-BR')}`,
        ''
      ];
      PERGUNTAS.forEach((p, idx) => {
        const r = estado.respostas[p.id] || {};
        const resp = r.naoSei ? 'Não sei responder agora (pendente)' : (r.opcao || 'Sem opção selecionada');
        linhas.push(`*${idx + 1}. ${p.titulo}*`);
        linhas.push(`Resposta: ${resp}`);
        if (r.nota && r.nota.trim()) {
          linhas.push(`Obs.: ${r.nota.trim()}`);
        }
        linhas.push('');
      });
      return linhas.join('\n');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    render();
  </script>
</body>
</html>
